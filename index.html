<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Playwrite+AR:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rosarivo:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #7001fd;
        --color-secondary: #555555;
        --color-text: #c2c2c2;
        --color-background: #eeeeee;
      }
    </style>
  </head>
  <body>
    <section class="flex w-screen h-screen bg-background">
      <section class="bg-white w-[100%] pt-15   md:w-[40%] pt-5 sm:pt-40 ">
        <div class="flex justify-center mb-5">
          <img class="mt-10 h-15 w-40 " src="./assets/logo.svg" alt="logo" />
        </div>
        <div class="flex justify-center mb-10  font-semibold">Login into your account</div>
        <div class="flex justify-center">
          
          <!-- email field -->
            <div class="text-sm text-gray-700">
            Email Address
            <div>
              <div
                class="bg-[#F1F3F6] :placeholder pl-4 text-xs flex rounded mt-2"
              >
                <input
                  class="w-50 sm:w-70 md:w-60 lg:w-70 xl:w-90 h-10 border-none outline-none focus:outline-none focus:ring-0"
                  type="text"
                  name="text"
                  id="text"
                  placeholder="murendeni@email.com"
                />
                <div
                  class="bg-primary flex justify-center items-center rounded w-10 "
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="1.5em"
                    height="1.5em"
                    viewBox="0 0 24 24"
                  >
                    <title>mail-outline-rounded</title>
                    <path
                      fill="#ffffff"
                      d="M4 20q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h16q.825 0 1.413.588T22 6v12q0 .825-.587 1.413T20 20zM20 8l-7.475 4.675q-.125.075-.262.113t-.263.037t-.262-.037t-.263-.113L4 8v10h16zm-8 3l8-5H4zM4 8v.25v-1.475v.025V6v.8v-.012V8.25zv10z"
                    />
                  </svg>
                </div>
              </div>
            </div>

<!-- password fieldd -->
            <div class="text-sm text-gray-700 mt-5">
            Password
            <div>
              <div
                class="bg-[#F1F3F6] :placeholder pl-4 text-xs flex rounded mt-2"
              >
                <input
                  class="w-50 sm:w-70 md:w-60 lg:w-70 xl:w-90 h-10 border-none outline-none focus:outline-none focus:ring-0"
                  type="password"
                  name="password"
                  id="password"
                  placeholder="Enter your password"
                />
                <div
                  class="bg-primary flex justify-center items-center rounded w-10"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24"><title>padlock</title><path fill="#ffffff" d="M12 13a1.49 1.49 0 0 0-1 2.61V17a1 1 0 0 0 2 0v-1.39A1.49 1.49 0 0 0 12 13m5-4V7A5 5 0 0 0 7 7v2a3 3 0 0 0-3 3v7a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-7a3 3 0 0 0-3-3M9 7a3 3 0 0 1 6 0v2H9Zm9 12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1Z"/></svg>
                </div>
              </div>
            </div>
            <div class="flex justify-end mt-2 ">
                <a class="text-xs underline" href="#"> Forgot password?</a>
            </div>
             <div
                class="bg-primary h-10 flex justify-center items-center text-xs flex rounded mt-10 text-white :hover cursor-pointer "
              >
              Login now
              </div>
              <div class="flex items-center gap-5 mt-5">
                <div class="border-b border-gray-300 mt-5 w-[50%]"></div> <span class="pt-5 text-xs text-gray-400">OR</span>
                <div class="border-b border-gray-300 mt-5 w-[50%]"></div>
              </div>
                    
              <div
                class="border h-10 flex justify-center items-center text-xs flex rounded mt-10 text-primary mb-10 cursor-pointer"
              >
              Signup Now
              </div>

        </div>
        </div>

        
      </section>

      <section class="flex justify-center items-center hidden sm:w-100 sm:flex   md:flex  md:w-[60%] ">
       <div class=" text-center">
        <span class="text-xl font-semibold">You Should, Moveit!</span>
        <div> <img src="./Delivery.svg" alt=""></div>
       </div>

    </section>
    </section>
  </body>
</html>
